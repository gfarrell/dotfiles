[ui]
pager = ":builtin"
paginate = "auto"
default-command = "st"
# use difftastic for diffs
diff-formatter = ["difft", "--color=always", "$left", "$right"]
# use mergiraf for conflicts
merge-editor = "mergiraf"

[user]
name = "Gideon Farrell"
email = "gideon@gtf.io"

[signing]
backend = "gpg"
behavior = "own"

[git]
sign-on-push = true

[aliases]
l = ["log", "-r", "@ | ancestors(@, 10)"]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]

[merge-tools.diffconflicts]
program = "nvim"
merge-args = [
    "-c", "let g:jj_diffconflicts_marker_length=$marker_length",
    "-c", "JJDiffConflicts!", "$output", "$base", "$left", "$right",
]
merge-tool-edits-conflict-markers = true

# When working in Converge repos, change my email address
[[--scope]]
--when.repositories = ["~/converge"]
[--scope.user]
email = "gideon@converge.io"
